<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro-friendly recipes</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,600,700&display=swap">
<link rel="stylesheet" href="/fonts.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root, [data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --bg2: #f5f4f0; --bg3: #eeedea;
    --text: #1a1a18; --text2: #6b6b65; --text3: #9a9a94;
    --border: rgba(0,0,0,0.09); --border2: rgba(0,0,0,0.16);
    --info: #1a5fa8; --brand-jann: #c5a58a; --radius: 8px; --radius-lg: 12px;
    --star: #1a1a18;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1d1c; --bg2: #1c1d1c; --bg3: #282928;
    --text: #f0efe8; --text2: #a0a09a; --text3: #6a6a64;
    --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.16);
    --info: #5ba3e8;
    --brand-jann: #6482a2;
    --star: #f0efe8;
  }
  body { background: var(--bg2); color: var(--text); min-height: 100vh; }
  .app { max-width: 1120px; margin: 0 auto; }
  .site-shell {
    position: sticky; top: 0; z-index: 40;
  }
  .admin-bar {
    background: var(--text); color: var(--bg);
    font-size: 0.75rem; font-weight: 600;
  }
  .admin-bar-inner {
    max-width: 1120px; margin: 0 auto;
    padding: 0.38rem 1.25rem;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 1.35rem;
  }
  .admin-bar-link {
    color: inherit; text-decoration: none; opacity: 0.88;
    transition: opacity 0.12s;
  }
  .admin-bar-link:hover { opacity: 1; }
  .admin-bar-btn {
    font: inherit; font-size: inherit; font-weight: inherit;
    color: inherit; background: none; border: none; padding: 0;
    cursor: pointer; opacity: 0.88; transition: opacity 0.12s;
  }
  .admin-bar-btn:hover { opacity: 1; }
  [data-theme="dark"] .admin-bar {
    background: var(--bg3); color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .site-top {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .site-top-bar,
  .site-nav-row {
    max-width: 1120px; margin: 0 auto;
    padding-left: 1.25rem; padding-right: 1.25rem;
  }
  .site-top-bar {
    display: grid;
    grid-template-columns: 1fr minmax(220px, 560px) 1fr;
    align-items: center;
    gap: 1rem 1.5rem;
    padding-top: 0.85rem;
    padding-bottom: 0.85rem;
  }
  .site-brand { justify-self: start; }
  .site-brand-link { text-decoration: none; color: inherit; display: block; line-height: 0; }
  .site-logo { display: block; height: 6.3rem; width: auto; }
  .site-logo-dark { display: none; }
  [data-theme="dark"] .site-logo-light { display: none; }
  [data-theme="dark"] .site-logo-dark { display: block; }
  .site-search {
    grid-column: 2;
    width: 100%;
    position: relative;
  }
  .site-search-icon {
    position: absolute; left: 0.75rem; top: 50%;
    transform: translateY(-50%);
    width: 1rem; height: 1rem;
    color: var(--text3); pointer-events: none;
  }
  .site-search-input {
    width: 100%;
    font: inherit; font-size: 0.9375rem;
    padding: 0.62rem 0.85rem 0.62rem 2.35rem;
    border: 1px solid var(--border2);
    border-radius: 2px;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.15s;
  }
  .site-search-input::placeholder { color: color-mix(in srgb, var(--text3) 55%, white); }
  [data-theme="dark"] .site-search-input::placeholder { color: color-mix(in srgb, var(--text) 62%, transparent); }
  .site-search-input:focus {
    outline: none;
    border-color: var(--text2);
  }
  .site-actions {
    grid-column: 3;
    justify-self: end;
    display: flex; align-items: center; gap: 1.1rem;
    font-size: 0.8125rem; flex-shrink: 0;
  }
  .site-action-link {
    display: inline-flex; align-items: center; gap: 0.35rem;
    color: var(--text); text-decoration: none; font-weight: 600;
    white-space: nowrap;
  }
  .site-action-link:hover { color: var(--info); }
  .site-action-icon { width: 1rem; height: 1rem; flex-shrink: 0; }
  .site-action-btn {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font: inherit; font-size: inherit; font-weight: 600;
    background: none; border: none;
    color: var(--text); cursor: pointer; padding: 0;
    white-space: nowrap;
  }
  .site-action-btn:hover { color: var(--info); }
  .site-action-btn.active { color: var(--info); }
  .fav-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.15rem; height: 2.15rem; padding: 0;
    border: none; border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: var(--text2); cursor: pointer;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14);
    transition: color 0.12s, background 0.12s, transform 0.12s;
    flex-shrink: 0;
  }
  .fav-btn:hover { color: var(--text); transform: scale(1.04); }
  .fav-btn.active { color: var(--info); }
  .fav-btn-icon {
    width: 1rem; height: 1rem;
    fill: none; stroke: currentColor; stroke-width: 2;
  }
  .fav-btn.active .fav-btn-icon { fill: currentColor; }
  .fav-btn--card {
    position: absolute; top: 0.55rem; right: 0.55rem; z-index: 2;
  }
  .recipe-card-edit {
    display: none;
    position: absolute; bottom: 0.55rem; left: 0.55rem; z-index: 2;
    font: inherit; font-size: 0.6875rem; font-weight: 600;
    padding: 0.35rem 0.55rem; border: none; border-radius: 6px;
    background: rgba(0, 0, 0, 0.72); color: #fff; cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .is-admin .recipe-card-edit { display: inline-block; }
  .recipe-card-edit:hover { background: rgba(0, 0, 0, 0.85); }
  .list-empty {
    color: var(--text2); font-size: 0.9375rem; line-height: 1.5;
    padding: 1.5rem 0 0.5rem;
  }
  .site-nav-row {
    border-top: 1px solid var(--border);
    padding-top: 0.55rem;
    padding-bottom: 0.55rem;
  }
  .browse-nav {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 0.15rem 1.35rem;
    width: 100%; min-width: 0;
  }
  .browse-tab {
    font-size: 0.9375rem; font-weight: 700; font-family: inherit;
    padding: 0.35rem 0; background: none; border: none;
    border-bottom: 2px solid transparent; color: var(--text);
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: color 0.12s, border-color 0.12s;
    text-decoration: none;
  }
  .browse-tab:hover { color: var(--info); }
  .browse-tab.active { border-bottom-color: var(--brand-jann); }
  .browse-menu { position: relative; flex-shrink: 0; }
  .browse-panel {
    display: none;
    position: absolute; top: 100%; left: 0;
    width: max-content;
    max-width: min(720px, calc(100vw - 2.5rem));
    min-width: 9.5rem;
    padding-top: 0.45rem;
    z-index: 50;
  }
  .browse-panel-inner {
    padding: 1rem 1.15rem 1.1rem;
    background: var(--bg);
    border: none;
    border-radius: var(--radius-lg);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, max-content));
    gap: 1rem 1.75rem;
    width: max-content;
    max-width: min(720px, calc(100vw - 2.5rem));
  }
  [data-theme="dark"] .browse-panel-inner {
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  .browse-menu.is-open .browse-panel { display: block; }
  .browse-section-name {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text3);
    margin: 0 0 0.45rem;
  }
  .browse-section-links {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 0.15rem;
  }
  .browse-link {
    font: inherit; font-size: 0.875rem; font-weight: 400;
    padding: 0.28rem 0; background: none; border: none;
    color: var(--text); cursor: pointer; text-align: left;
    transition: color 0.12s; text-decoration: none; display: inline-block;
  }
  .browse-link:hover { color: var(--info); }
  .browse-link.active { color: var(--info); font-weight: 600; }
  .list-heading {
    font-size: 1.75rem; font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 0.65rem;
    color: var(--text);
  }
  .list-filters {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 0.5rem 0.65rem;
    margin-bottom: 1.15rem;
  }
  .list-filter-menu { position: relative; }
  .list-filter-trigger {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font: inherit; font-size: 0.8125rem; font-weight: 500;
    padding: 0.38rem 0.55rem 0.38rem 0.7rem; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--bg);
    color: var(--text); cursor: pointer; white-space: nowrap;
    transition: border-color 0.12s, color 0.12s;
  }
  .list-filter-trigger-label { line-height: 1.2; }
  .list-filter-chevron {
    width: 0.75rem; height: 0.75rem; flex-shrink: 0;
    color: var(--text3);
    transition: transform 0.15s ease, color 0.12s;
  }
  .list-filter-trigger:hover .list-filter-chevron { color: var(--info); }
  .list-filter-menu.is-open .list-filter-chevron { transform: rotate(180deg); }
  .list-filter-trigger:hover { border-color: var(--text3); color: var(--info); }
  .list-filter-trigger.has-selection {
    border-color: var(--text); font-weight: 600;
  }
  .list-filter-panel {
    display: none;
    position: absolute; top: calc(100% + 4px); left: 0;
    min-width: 11.5rem; z-index: 30;
    padding: 0.45rem 0.35rem;
    background: var(--bg);
    border: 1px solid var(--border2);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    border-radius: var(--radius);
  }
  [data-theme="dark"] .list-filter-panel {
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  }
  .list-filter-menu.is-open .list-filter-panel { display: block; }
  .list-filter-options {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 0.1rem;
  }
  .list-filter-option {
    display: flex; align-items: center; gap: 0.45rem;
    padding: 0.32rem 0.45rem; font-size: 0.8125rem;
    color: var(--text); cursor: pointer; border-radius: 4px;
  }
  .list-filter-option:hover { background: var(--bg2); }
  .list-filter-option input {
    width: 0.9rem; height: 0.9rem; margin: 0; flex-shrink: 0;
    accent-color: var(--info);
  }
  .list-body { padding: 1.5rem 1.25rem 4rem; }
  .recipe-grid {
    display: grid; grid-template-columns: 1fr; gap: 1.5rem;
    align-items: start;
  }
  .recipe-card {
    display: flex; flex-direction: column; width: 100%;
    cursor: pointer; border: none; background: none;
    text-decoration: none; color: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .recipe-card-media {
    position: relative; width: 100%; aspect-ratio: 16 / 11;
    border-radius: var(--radius-lg); overflow: hidden;
    background: var(--bg3);
  }
  .recipe-card-img {
    display: block; width: 100%; height: 100%; object-fit: cover;
  }
  .recipe-card-emoji {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; font-size: 48px; line-height: 1;
  }
  .recipe-card-body {
    padding: 0.75rem 0.15rem 0; min-width: 0;
  }
  .recipe-card-new {
    position: absolute; top: 0.55rem; left: 0.55rem; z-index: 2;
    display: inline-block;
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--info); color: #fff;
  }
  .recipe-card-title {
    margin: 0 0 0.2rem; font-size: 1.25rem; font-weight: 700;
    line-height: 1.25; letter-spacing: -0.02em;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    line-clamp: 2; overflow: hidden;
  }
  .recipe-card-source,
  .source {
    display: flex; align-items: center; gap: 0.35rem;
    font-size: 0.8125rem; color: var(--text2); margin-bottom: 0.35rem;
    line-height: 1.35; min-width: 0;
  }
  .recipe-card-source-label,
  .source .recipe-card-source-label {
    color: inherit; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recipe-card-source-label:hover,
  .source a.recipe-card-source-label:hover { color: var(--info); }
  .source-type-icon,
  .meta-line-icon {
    width: 0.875rem; height: 0.875rem; flex-shrink: 0;
    color: var(--text3);
  }
  .source-type-icon--nyt,
  .meta-line-icon--nyt {
    width: 0.7rem; height: 0.91rem;
  }
  .recipe-card-time,
  .detail-time {
    display: flex; align-items: center; gap: 0.35rem;
    font-size: 0.8125rem; color: var(--text2); margin-bottom: 0.45rem;
    line-height: 1.35;
  }
  .detail-time { margin: 0; font-size: 0.875rem; }
  .recipe-card-rating-row {
    display: flex; align-items: center; gap: 0.35rem;
    margin-bottom: 0.25rem; min-height: 1.1rem;
  }
  .recipe-card-stars {
    font-size: 0.75rem; letter-spacing: 0.02em; color: var(--star); line-height: 1;
  }
  .recipe-card-rating-count {
    font-size: 0.8125rem; color: var(--text2); font-weight: 500;
  }
  .recipe-card-tags {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .recipe-card-tag {
    font-size: 10px; font-weight: 500; line-height: 1.2; padding: 3px 7px;
    border-radius: 999px; color: var(--text2);
    background: var(--bg3); border: 0.5px solid var(--border);
    white-space: nowrap;
  }
  .recipe-card:hover .recipe-card-title { color: var(--info); }
  .back-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--info); cursor: pointer; margin-bottom: 0.85rem; background: none; border: none; padding: 0; font-family: inherit; text-decoration: none; }
  .detail-nav { margin-bottom: 1.25rem; }
  .detail-nav .back-btn { margin-bottom: 0; }
  .detail-lead {
    display: grid; grid-template-columns: minmax(0, 0.42fr) minmax(0, 0.58fr);
    gap: 2rem 2.5rem; align-items: start; margin-bottom: 2.75rem;
  }
  .detail-lead-copy { display: flex; flex-direction: column; gap: 0.85rem; min-width: 0; }
  .detail-title {
    margin: 0; font-size: clamp(1.75rem, 3.2vw, 2.35rem); font-weight: 700;
    line-height: 1.12; letter-spacing: -0.025em; color: var(--text);
  }
  .detail-source {
    display: flex; align-items: center; gap: 0.4rem;
    margin: 0.1rem 0 0; padding: 0;
    font-size: 0.875rem; line-height: 1.35;
    color: var(--text2); min-width: 0;
  }
  .detail-source .recipe-card-source-label {
    color: inherit; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .detail-source a.recipe-card-source-label:hover { color: var(--info); }
  .detail-tags-line { margin: 0; font-size: 0.8125rem; color: var(--text2); }
  .detail-meta-list {
    display: flex; flex-direction: column; gap: 0.55rem;
    padding: 0.85rem 0 0; margin: 0; border-top: 1px solid var(--border);
  }
  .detail-meta-item { display: grid; grid-template-columns: 6.5rem 1fr; gap: 0.75rem; align-items: baseline; }
  .detail-meta-label { font-size: 0.8125rem; font-weight: 600; color: var(--text); }
  .detail-meta-value { font-size: 0.875rem; color: var(--text2); min-width: 0; }
  .detail-rating-stars { color: #e8a317; letter-spacing: 0.02em; }
  .serv-ctrl--detail { justify-content: flex-start; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; padding-top: 0.15rem; }
  .detail-action-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    font: inherit; font-size: 0.8125rem; font-weight: 600;
    padding: 0.5rem 0.95rem; border-radius: 999px;
    border: 1px solid var(--border2); background: var(--bg);
    color: var(--text); cursor: pointer; text-decoration: none;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .detail-action-btn:hover { border-color: var(--text3); color: var(--info); }
  .detail-action-btn--fav.active {
    background: var(--info); border-color: var(--info); color: #fff;
  }
  .detail-action-icon {
    width: 0.95rem; height: 0.95rem; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 2;
  }
  .detail-action-btn--fav.active .detail-action-icon { fill: currentColor; }
  .detail-macros-wrap { padding-top: 0.35rem; }
  .detail-macros-unit {
    margin: 0 0 0.3rem; padding: 0;
    font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text2);
  }
  .detail-macros {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem;
  }
  .detail-mac {
    padding: 0.65rem 0.35rem 0.55rem; text-align: center;
    border-top: 2px solid var(--text);
  }
  .detail-mac-val {

    font-variant-numeric: tabular-nums;
  }
  .detail-mac-lbl {
    display: block; font-size: 0.6875rem; color: var(--text2);
    margin-top: 0.1rem; text-transform: lowercase;
  }
  .detail-mac-tot {
    display: block; margin-top: 0.4rem; padding-top: 0.35rem;
    border-top: 1px solid var(--border);
    line-height: 1.25;
  }
  .detail-mac-tot-val {
    display: block; font-size: 0.8125rem; font-weight: 600;
    color: var(--text2); font-variant-numeric: tabular-nums;
  }
  .detail-mac-tot-lbl {
    display: block; margin-top: 0.05rem;
    font-size: 0.625rem; color: var(--text3); text-transform: lowercase;
  }
  .detail-mac-tot-serv {
    display: block; margin-top: 0.05rem;
    font-size: 0.625rem; color: var(--text3);
    font-variant-numeric: tabular-nums;
  }
  .detail-lead-media { min-width: 0; }
  .detail-hero {
    position: relative; width: 100%; aspect-ratio: 4 / 3; min-height: 280px;

  }
  .detail-hero::before { display: none; }
  .detail-recipe {
    display: grid; grid-template-columns: minmax(0, 0.42fr) minmax(0, 0.58fr);
    gap: 2rem 2.5rem; margin-bottom: 2rem;
  }
  .detail-sec-head {
    margin: 0 0 0.85rem; padding-top: 0.65rem;
    border-top: 2px solid var(--text);
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text);
  }
  .detail-sec-head-row {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem;
    margin: 0 0 0.85rem; padding-top: 0.65rem;
    border-top: 2px solid var(--text);
  }
  .detail-sec-head-row .detail-sec-head {
    margin: 0; padding-top: 0; border-top: none;
  }
  .detail-shopping-btn {
    flex-shrink: 0; font: inherit; font-size: 0.75rem; font-weight: 600;

  }
  .detail-shopping-btn:hover { color: var(--text); }
  .detail-ing-toolbar {

    gap: 0.65rem 0.85rem; flex-shrink: 1; min-width: 0;
  }

    accent-color: var(--text);
  }

  .ing-table--shop .ing-row--checked .ing-amt,
  .ing-table--shop .ing-row--checked .ing-macros {

  }
  .detail-sec-head--sub { margin-top: 0.5rem; margin-bottom: 0.85rem; }

  .ing-grp-head th {
    padding-top: 0.85rem; font-size: 0.6875rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--text2);
    border-bottom: 1px solid var(--border);

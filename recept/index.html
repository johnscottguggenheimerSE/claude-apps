<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro-friendly recipes</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,600,700&display=swap">
<link rel="stylesheet" href="fonts.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root, [data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --bg2: #f5f4f0; --bg3: #eeedea;
    --text: #1a1a18; --text2: #6b6b65; --text3: #9a9a94;
    --border: rgba(0,0,0,0.09); --border2: rgba(0,0,0,0.16);
    --info: #1a5fa8; --brand-jann: #c5a58a; --radius: 8px; --radius-lg: 12px;
    --star: #1a1a18;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1d1c; --bg2: #1c1d1c; --bg3: #282928;
    --text: #f0efe8; --text2: #a0a09a; --text3: #6a6a64;
    --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.16);
    --info: #5ba3e8;
    --brand-jann: #6482a2;
    --star: #f0efe8;
  }
  body { background: var(--bg2); color: var(--text); min-height: 100vh; }
  .app { max-width: 1120px; margin: 0 auto; }
  .site-shell {
    position: sticky; top: 0; z-index: 40;
  }
  .admin-bar {
    background: var(--text); color: var(--bg);
    font-size: 0.75rem; font-weight: 600;
  }
  .admin-bar-inner {
    max-width: 1120px; margin: 0 auto;
    padding: 0.38rem 1.25rem;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 1.35rem;
  }
  .admin-bar-link {
    color: inherit; text-decoration: none; opacity: 0.88;
    transition: opacity 0.12s;
  }
  .admin-bar-link:hover { opacity: 1; }
  .admin-bar-btn {
    font: inherit; font-size: inherit; font-weight: inherit;
    color: inherit; background: none; border: none; padding: 0;
    cursor: pointer; opacity: 0.88; transition: opacity 0.12s;
  }
  .admin-bar-btn:hover { opacity: 1; }
  [data-theme="dark"] .admin-bar {
    background: var(--bg3); color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .site-top {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .site-top-bar,
  .site-nav-row {
    max-width: 1120px; margin: 0 auto;
    padding-left: 1.25rem; padding-right: 1.25rem;
  }
  .site-top-bar {
    display: grid;
    grid-template-columns: 1fr minmax(220px, 560px) 1fr;
    align-items: center;
    gap: 1rem 1.5rem;
    padding-top: 0.85rem;
    padding-bottom: 0.85rem;
  }
  .site-brand { justify-self: start; }
  .site-brand-link { text-decoration: none; color: inherit; display: block; line-height: 0; }
  .site-logo { display: block; height: 6.3rem; width: auto; }
  .site-logo-dark { display: none; }
  [data-theme="dark"] .site-logo-light { display: none; }
  [data-theme="dark"] .site-logo-dark { display: block; }
  .site-search {
    grid-column: 2;
    width: 100%;
    position: relative;
  }
  .site-search-icon {
    position: absolute; left: 0.75rem; top: 50%;
    transform: translateY(-50%);
    width: 1rem; height: 1rem;
    color: var(--text3); pointer-events: none;
  }
  .site-search-input {
    width: 100%;
    font: inherit; font-size: 0.9375rem;
    padding: 0.62rem 0.85rem 0.62rem 2.35rem;
    border: 1px solid var(--border2);
    border-radius: 2px;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.15s;
  }
  .site-search-input::placeholder { color: color-mix(in srgb, var(--text3) 55%, white); }
  [data-theme="dark"] .site-search-input::placeholder { color: color-mix(in srgb, var(--text) 62%, transparent); }
  .site-search-input:focus {
    outline: none;
    border-color: var(--text2);
  }
  .site-actions {
    grid-column: 3;
    justify-self: end;
    display: flex; align-items: center; gap: 1.1rem;
    font-size: 0.8125rem; flex-shrink: 0;
  }
  .site-action-link {
    display: inline-flex; align-items: center; gap: 0.35rem;
    color: var(--text); text-decoration: none; font-weight: 600;
    white-space: nowrap;
  }
  .site-action-link:hover { color: var(--info); }
  .site-action-icon { width: 1rem; height: 1rem; flex-shrink: 0; }
  .site-action-btn {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font: inherit; font-size: inherit; font-weight: 600;
    background: none; border: none;
    color: var(--text); cursor: pointer; padding: 0;
    white-space: nowrap;
  }
  .site-action-btn:hover { color: var(--info); }
  .site-action-btn.active { color: var(--info); }
  .fav-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.15rem; height: 2.15rem; padding: 0;
    border: none; border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: var(--text2); cursor: pointer;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14);
    transition: color 0.12s, background 0.12s, transform 0.12s;
    flex-shrink: 0;
  }
  .fav-btn:hover { color: var(--text); transform: scale(1.04); }
  .fav-btn.active { color: var(--info); }
  .fav-btn-icon {
    width: 1rem; height: 1rem;
    fill: none; stroke: currentColor; stroke-width: 2;
  }
  .fav-btn.active .fav-btn-icon { fill: currentColor; }
  .fav-btn--card {
    position: absolute; top: 0.55rem; right: 0.55rem; z-index: 2;
  }
  .fav-btn--detail {
    width: 2.35rem; height: 2.35rem;
    background: var(--bg2);
    box-shadow: none; border: 0.5px solid var(--border);
  }
  .detail-summary-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 0.75rem;
  }
  .detail-summary-head .detail-summary-title { flex: 1; min-width: 0; }
  .list-empty {
    color: var(--text2); font-size: 0.9375rem; line-height: 1.5;
    padding: 1.5rem 0 0.5rem;
  }
  .site-nav-row {
    border-top: 1px solid var(--border);
    padding-top: 0.55rem;
    padding-bottom: 0.55rem;
  }
  .browse-nav {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 0.15rem 1.35rem;
    width: 100%; min-width: 0;
  }
  .browse-tab {
    font-size: 0.9375rem; font-weight: 700; font-family: inherit;
    padding: 0.35rem 0; background: none; border: none;
    border-bottom: 2px solid transparent; color: var(--text);
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: color 0.12s, border-color 0.12s;
  }
  .browse-tab:hover { color: var(--info); }
  .browse-tab.active { border-bottom-color: var(--brand-jann); }
  .browse-menu { position: relative; flex-shrink: 0; }
  .browse-panel {
    display: none;
    position: absolute; top: 100%; left: 0;
    width: min(720px, calc(100vw - 2.5rem));
    min-width: 0;
    padding-top: 0.45rem;
    z-index: 50;
  }
  .browse-panel-inner {
    padding: 1rem 1.15rem 1.1rem;
    background: var(--bg);
    border: none;
    border-radius: var(--radius-lg);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1rem 1.75rem;
  }
  [data-theme="dark"] .browse-panel-inner {
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  .browse-menu.is-open .browse-panel { display: block; }
  .browse-section-name {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text3);
    margin: 0 0 0.45rem;
  }
  .browse-section-links {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 0.15rem;
  }
  .browse-link {
    font: inherit; font-size: 0.875rem; font-weight: 400;
    padding: 0.28rem 0; background: none; border: none;
    color: var(--text); cursor: pointer; text-align: left;
    transition: color 0.12s;
  }
  .browse-link:hover { color: var(--info); }
  .browse-link.active { color: var(--info); font-weight: 600; }
  .list-heading {
    font-size: 1.75rem; font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 0.65rem;
    color: var(--text);
  }
  .list-filters {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 0.5rem 0.65rem;
    margin-bottom: 1.15rem;
  }
  .list-filter-menu { position: relative; }
  .list-filter-trigger {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font: inherit; font-size: 0.8125rem; font-weight: 500;
    padding: 0.38rem 0.55rem 0.38rem 0.7rem; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--bg);
    color: var(--text); cursor: pointer; white-space: nowrap;
    transition: border-color 0.12s, color 0.12s;
  }
  .list-filter-trigger-label { line-height: 1.2; }
  .list-filter-chevron {
    width: 0.75rem; height: 0.75rem; flex-shrink: 0;
    color: var(--text3);
    transition: transform 0.15s ease, color 0.12s;
  }
  .list-filter-trigger:hover .list-filter-chevron { color: var(--info); }
  .list-filter-menu.is-open .list-filter-chevron { transform: rotate(180deg); }
  .list-filter-trigger:hover { border-color: var(--text3); color: var(--info); }
  .list-filter-trigger.has-selection {
    border-color: var(--text); font-weight: 600;
  }
  .list-filter-panel {
    display: none;
    position: absolute; top: calc(100% + 4px); left: 0;
    min-width: 11.5rem; z-index: 30;
    padding: 0.45rem 0.35rem;
    background: var(--bg);
    border: 1px solid var(--border2);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    border-radius: var(--radius);
  }
  [data-theme="dark"] .list-filter-panel {
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  }
  .list-filter-menu.is-open .list-filter-panel { display: block; }
  .list-filter-options {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 0.1rem;
  }
  .list-filter-option {
    display: flex; align-items: center; gap: 0.45rem;
    padding: 0.32rem 0.45rem; font-size: 0.8125rem;
    color: var(--text); cursor: pointer; border-radius: 4px;
  }
  .list-filter-option:hover { background: var(--bg2); }
  .list-filter-option input {
    width: 0.9rem; height: 0.9rem; margin: 0; flex-shrink: 0;
    accent-color: var(--info);
  }
  .list-body { padding: 1.5rem 1.25rem 4rem; }
  .recipe-grid {
    display: grid; grid-template-columns: 1fr; gap: 1.5rem;
    align-items: start;
  }
  .recipe-card {
    display: flex; flex-direction: column; width: 100%;
    cursor: pointer; border: none; background: none;
    text-decoration: none; color: inherit;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .recipe-card-media {
    position: relative; width: 100%; aspect-ratio: 16 / 11;
    border-radius: var(--radius-lg); overflow: hidden;
    background: var(--bg3);
  }
  .recipe-card-img {
    display: block; width: 100%; height: 100%; object-fit: cover;
  }
  .recipe-card-emoji {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; font-size: 48px; line-height: 1;
  }
  .recipe-card-body {
    padding: 0.75rem 0.15rem 0; min-width: 0;
  }
  .recipe-card-new {
    display: inline-block; margin-bottom: 0.35rem;
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--info); color: #fff;
  }
  .recipe-card-title {
    margin: 0 0 0.2rem; font-size: 1.25rem; font-weight: 700;
    line-height: 1.25; letter-spacing: -0.02em;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    line-clamp: 2; overflow: hidden;
  }
  .recipe-card-source,
  .source {
    display: flex; align-items: center; gap: 0.35rem;
    font-size: 0.8125rem; color: var(--text2); margin-bottom: 0.35rem;
    line-height: 1.35; min-width: 0;
  }
  .recipe-card-source-label,
  .source .recipe-card-source-label {
    color: inherit; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recipe-card-source-label:hover,
  .source a.recipe-card-source-label:hover { color: var(--info); }
  .source-type-icon {
    width: 0.875rem; height: 0.875rem; flex-shrink: 0;
    color: var(--text3);
  }
  .source-type-icon--nyt {
    width: 0.7rem; height: 0.91rem;
  }
  .recipe-card-rating-row {
    display: flex; align-items: center; gap: 0.35rem;
    margin-bottom: 0.25rem; min-height: 1.1rem;
  }
  .recipe-card-stars {
    font-size: 0.75rem; letter-spacing: 0.02em; color: var(--star); line-height: 1;
  }
  .recipe-card-rating-count {
    font-size: 0.8125rem; color: var(--text2); font-weight: 500;
  }
  .recipe-card-time {
    font-size: 0.8125rem; color: var(--text2); margin-bottom: 0.45rem;
  }
  .recipe-card-tags {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .recipe-card-tag {
    font-size: 10px; font-weight: 500; line-height: 1.2; padding: 3px 7px;
    border-radius: 999px; color: var(--text2);
    background: var(--bg3); border: 0.5px solid var(--border);
    white-space: nowrap;
  }
  .recipe-card:hover .recipe-card-title { color: var(--info); }
  .back-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--info); cursor: pointer; margin-bottom: 0.85rem; background: none; border: none; padding: 0; font-family: inherit; text-decoration: none; }
  .detail-nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.85rem; }
  .detail-nav .back-btn { margin-bottom: 0; }
  #detail-edit-link { display: none !important; }
  html.is-admin #detail-edit-link { display: inline-flex !important; }
  .detail-top {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
    align-items: stretch; margin-bottom: 1.5rem;
  }
  .detail-hero {
    position: relative; width: 100%; min-height: 280px; height: 100%;
    border-radius: var(--radius-lg); overflow: hidden;
    background-color: var(--bg2); background-size: cover; background-position: center;
  }
  .detail-summary { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
  .detail-summary-title { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
  .detail-meta-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
  .detail-summary .source { margin-bottom: 0; font-size: 12px; }
  .detail-summary .badges { margin-bottom: 0; flex: 1; min-width: 0; }
  .detail-summary .macros { margin-bottom: 0; grid-template-columns: 1fr 1fr; }
  .detail-hero::before {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, transparent 42%, rgba(0,0,0,0.5) 75%, rgba(0,0,0,0.88) 100%);
  }
  .detail-hero--photo::before { display: none; }
  .detail-hero--fallback::before {
    background: linear-gradient(180deg, transparent 0%, transparent 50%, rgba(0,0,0,0.55) 100%);
  }
  .detail-hero-emoji {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%);
    font-size: 64px; line-height: 1; z-index: 0;
  }
  .detail-hero-tags {
    position: absolute; top: 12px; left: auto; right: 12px; z-index: 2;
    width: min(52%, calc(100% - 24px));
    display: grid; grid-template-columns: 1fr; gap: 5px; justify-items: end;
    pointer-events: none;
  }
  .detail-hero-tag {
    font-size: 11px; font-weight: 500; line-height: 1.2; padding: 5px 8px;
    border-radius: 999px; color: #fff; background: rgba(0,0,0,0.62);
    border: 0.5px solid rgba(255,255,255,0.2); text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 100%;
  }
  .detail-hero-title {
    position: absolute; right: 14px; bottom: 14px; left: 14px; z-index: 2; margin: 0;
    padding: 12px 14px; font-size: 22px; font-weight: 600; line-height: 1.2;
    color: #fff; text-align: right;
    letter-spacing: -0.02em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 2px 16px rgba(0,0,0,0.75), 0 0 28px rgba(0,0,0,0.5);
  }
  .serv-ctrl { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .serv-btn { width: 26px; height: 26px; border-radius: 50%; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
  .serv-val { font-size: 13px; font-weight: 500; color: var(--text); min-width: 16px; text-align: center; }
  .serv-lbl { font-size: 12px; color: var(--text2); }
  .recipe-validate-banner {
    background: #8b1a1a; color: #fff; padding: 0.75rem 1rem; font-size: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.2);
  }
  .recipe-validate-banner ul { margin: 0.35rem 0 0; padding-left: 1.2rem; }
  .recipe-validate-banner li { margin: 0.15rem 0; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.1rem; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: var(--radius); background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border); }
  .macros { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; margin-bottom: 1.5rem; }
  .mac { background: var(--bg2); border-radius: var(--radius); padding: 0.65rem; text-align: center; }
  .mac-val { font-size: 16px; font-weight: 500; color: var(--text); display: block; }
  .mac-lbl { font-size: 10px; color: var(--text2); margin-top: 2px; display: block; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  .sec-title { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); margin-bottom: 0.65rem; }
  .ing-grp { margin-bottom: 0.9rem; }
  .ing-grp-name { font-size: 11px; font-weight: 500; color: var(--text2); margin-bottom: 0.3rem; padding-bottom: 0.25rem; border-bottom: 0.5px solid var(--border); }
  .ing-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text); padding: 3px 0; border-bottom: 0.5px solid var(--border); }
  .ing-row:last-child { border-bottom: none; }
  .ing-amt { color: var(--text2); white-space: nowrap; margin-left: 8px; }
  .step { display: flex; gap: 9px; margin-bottom: 0.8rem; }
  .step-num { width: 19px; height: 19px; min-width: 19px; border-radius: 50%; background: var(--bg2); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: var(--text2); margin-top: 1px; }
  .step-title { font-size: 0.875rem; font-weight: 700; color: var(--text); margin-bottom: 0.2rem; }
  .step-text { font-size: 0.8125rem; color: var(--text2); line-height: 1.55; }
  .tips-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tip-box { background: var(--bg2); border-radius: var(--radius); padding: 0.8rem 0.95rem; }
  .tip-title { font-size: 0.875rem; font-weight: 700; color: var(--text); margin-bottom: 0.35rem; }
  .tip-text { font-size: 0.8125rem; color: var(--text2); line-height: 1.55; }
  .reviews-panel {
    margin-top: 1.5rem; padding: 1rem; border-radius: var(--radius-lg);
    background: var(--bg); border: 0.5px solid var(--border);
  }
  .reviews-summary { font-size: 14px; font-weight: 500; margin-bottom: 0.75rem; }
  .star-picker { display: flex; gap: 0.25rem; margin-bottom: 0.65rem; }
  .star-btn {
    font: inherit; font-size: 1.35rem; line-height: 1; padding: 0.15rem 0.2rem;
    background: none; border: none; color: var(--text3); cursor: pointer;
  }
  .star-btn.active { color: #e8a317; }
  .review-comment {
    width: 100%; min-height: 72px; font: inherit; font-size: 0.875rem;
    padding: 0.6rem 0.75rem; border: 0.5px solid var(--border); border-radius: var(--radius);
    background: var(--bg2); color: var(--text); margin-bottom: 0.65rem; resize: vertical;
  }
  .review-submit {
    font: inherit; font-size: 0.8125rem; font-weight: 600;
    padding: 0.5rem 0.85rem; border-radius: var(--radius);
    background: var(--info); color: #fff; border: none; cursor: pointer;
  }
  .review-submit:disabled { opacity: 0.55; cursor: default; }
  .review-list { margin-top: 1rem; }
  .review-item {
    padding: 0.55rem 0; border-bottom: 0.5px solid var(--border);
    font-size: 0.8125rem; line-height: 1.45;
  }
  .review-item:last-child { border-bottom: none; }
  .review-item-stars { color: #e8a317; font-weight: 600; margin-bottom: 0.15rem; }
  .review-item-text { color: var(--text2); }
  .detail-body { padding: 1rem 1rem 4rem; max-width: 1120px; margin: 0 auto; }
  .hidden { display: none !important; }
  @media (min-width: 521px) {
    .recipe-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 901px) {
    .recipe-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 720px) {
    .detail-top { grid-template-columns: 1fr; }
    .detail-hero { min-height: 220px; aspect-ratio: 16 / 9; height: auto; }
    .list-body, .detail-body { padding: 1.15rem 0.85rem 3rem; }
    .site-top-bar {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      padding: 0.65rem 0.85rem;
    }
    .site-brand { grid-column: 1; grid-row: 1; min-width: 0; }
    .site-logo { height: 3.25rem; }
    .site-actions { grid-column: 2; grid-row: 1; gap: 0.55rem; }
    .site-search {
      grid-column: 1 / -1; grid-row: 2;
      margin-top: 0.15rem;
    }
    .site-nav-row { padding-left: 0.85rem; padding-right: 0.85rem; }
    .admin-bar-inner { padding-left: 0.85rem; padding-right: 0.85rem; }
    .browse-nav {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      gap: 0.15rem 1.1rem;
      padding-bottom: 0.1rem;
      scrollbar-width: none;
    }
    .browse-nav::-webkit-scrollbar { display: none; }
    .browse-panel-inner {
      grid-template-columns: 1fr;
      max-height: min(60vh, 420px);
      overflow: auto;
    }
    .list-heading { font-size: 1.45rem; margin-bottom: 0.75rem; }
    .recipe-card-title { font-size: 1.125rem; }
    .detail-summary-title { font-size: 20px; }
    .detail-meta-row { flex-direction: column; align-items: stretch; }
    .serv-ctrl { align-self: flex-end; }
    .detail-hero-tag { font-size: 10px; padding: 4px 6px; }
  }
  @media (max-width: 420px) {
    .site-action-btn { font-size: 0; gap: 0; padding: 0.15rem; }
    .site-action-icon { width: 1.125rem; height: 1.125rem; }
  }
  @media (max-width: 520px) {
    .two-col { grid-template-columns: 1fr; }
    .tips-grid { grid-template-columns: 1fr; }
    .macros { grid-template-columns: repeat(2,1fr); }
    .detail-hero-tag { font-size: 10px; padding: 4px 6px; }
  }
</style>
</head>
<body>
<div class="site-shell">
  <div class="admin-bar">
    <div class="admin-bar-inner"></div>
  </div>
  <header class="site-top" id="site-top">
  <div class="site-top-bar">
    <div class="site-brand">
      <a href="/" class="site-brand-link" id="brand-home">
        <img src="images/logo-light.png" alt="Macro-friendly recipes by Jann" class="site-logo site-logo-light" width="1024" height="262">
        <img src="images/logo-dark.png" alt="Macro-friendly recipes by Jann" class="site-logo site-logo-dark" width="1024" height="262">
      </a>
    </div>
    <div class="site-search">
      <svg class="site-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      <input type="search" id="recipe-search" class="site-search-input" placeholder="Vad vill du laga?" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="site-actions">
      <button type="button" id="favorites-toggle-btn" class="site-action-btn" aria-label="Favoriter">
        <svg class="site-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Favoriter
      </button>
      <button type="button" id="theme-toggle-btn" class="site-action-btn" aria-label="Byt tema">
        <svg class="site-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="theme-toggle-label">Mörkt</span>
      </button>
    </div>
  </div>
  <div class="site-nav-row">
    <nav class="browse-nav" id="browse-nav" aria-label="Bläddra recept"></nav>
  </div>
  </header>
</div>
<div class="app">
  <div id="view-list">
    <div class="list-body">
      <h1 class="list-heading" id="list-heading">Alla recept</h1>
      <div class="list-filters" id="list-filters" aria-label="Filtrera recept"></div>
      <div id="recipe-list"></div>
    </div>
  </div>
  <div id="view-detail" class="hidden">
    <div class="detail-body">
      <div class="detail-nav">
        <button type="button" class="back-btn" id="back-btn">Tillbaka</button>
        <a class="back-btn" id="detail-edit-link" href="/add" hidden>Redigera</a>
      </div>
      <div id="detail-content"></div>
    </div>
  </div>
</div>
<script src="recipe-validate.js"></script>
<script src="browse-nav.js"></script>
<script src="site-shell.js"></script>
<script src="app.js"></script>
</body>
</html>
